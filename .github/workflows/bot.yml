name: Paper trading bot

on:
  schedule:
    - cron: "*/15 * * * *"   # la fiecare 15 minute (GitHub poate întârzia câteva minute)
  workflow_dispatch:          # buton manual „Run workflow"

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rulează botul conservator
        run: python bot.py run

      - name: Rulează botul agresiv
        if: always()
        run: python bot_agresiv.py run

      - name: Salvează starea și raportul
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data RAPORT.md data-agresiv RAPORT-AGRESIV.md || true
          git diff --cached --quiet || git commit -m "bot: actualizare $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push --quiet
